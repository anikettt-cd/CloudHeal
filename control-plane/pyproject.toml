[project]
name = "cloudheal-control-plane"
version = "0.1.0"
description = "CloudHeal control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
]

[project.scripts]
cloudheal-control-plane = "cloudheal_control_plane.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"